<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>键盘避让诊断（临时工具）</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; font-size: 14px; }
  table { border-collapse: collapse; margin: 8px 0; }
  td, th { border: 1px solid #ccc; padding: 4px 10px; text-align: left; }
  .hot { background: #ffe9a8; }
  textarea { width: 100%; height: 60px; margin: 8px 0; font-size: 15px; }
  #log { font: 12px/1.6 monospace; background: #f5f5f5; padding: 8px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
  h3 { margin: 14px 0 4px; }
</style>
</head>
<body>
<h2>键盘避让诊断（临时工具）</h2>
<p>点下面的输入框弹出/收起键盘，观察数字与日志变化，截图反馈即可。</p>
<table>
  <tr><th>服务器</th><td id="host">—</td></tr>
  <tr><th>visualViewport.height</th><td id="vvh" class="hot">—</td></tr>
  <tr><th>window.innerHeight</th><td id="ih" class="hot">—</td></tr>
  <tr><th>vv.scale</th><td id="scale">—</td></tr>
  <tr><th>pointer: coarse</th><td id="coarse">—</td></tr>
  <tr><th>事件计数 vv/窗口/聚焦</th><td id="cnt">0 / 0 / 0</td></tr>
  <tr><th>屏幕（CSS px）</th><td id="scr">—</td></tr>
  <tr><th>UA</th><td id="ua" style="max-width:280px;word-break:break-all">—</td></tr>
</table>
<textarea id="box" placeholder="点这里弹键盘"></textarea>
<p><button id="chipbtn" style="padding:8px 14px;font-size:14px"></button> <span class="tiny muted" style="font-size:12px">调试浮窗显示在每个极简页面右上角（h=当前高度 base=基准 open=是否判定键盘），跟着你走「记 → AI记账 → 记」复现路径，坏的时候截图浮窗即可</span></p>
<h3>事件日志（最新在上）</h3>
<div id="log">（等待事件…）</div>
<script>
(function () {
  document.getElementById('host').textContent = location.host;
  document.getElementById('ua').textContent = navigator.userAgent;
  document.getElementById('scr').textContent = screen.width + '×' + screen.height;
  var vv = window.visualViewport, n = { vv: 0, win: 0, foc: 0 }, last = 0;
  function fmt(tag, extra) {
    var t = (performance.now() / 1000).toFixed(1);
    return t + 's ' + tag + ' vv=' + Math.round(vv.height) + ' ih=' + innerHeight + ' scale=' + (vv.scale || 1).toFixed(2) + (extra ? ' ' + extra : '');
  }
  function refresh() {
    document.getElementById('vvh').textContent = Math.round(vv.height);
    document.getElementById('ih').textContent = innerHeight;
    document.getElementById('scale').textContent = (vv.scale || 1).toFixed(2);
    document.getElementById('coarse').textContent = matchMedia('(pointer: coarse)').matches + ' / hover:' + matchMedia('(hover: hover)').matches;
    document.getElementById('cnt').textContent = n.vv + ' / ' + n.win + ' / ' + n.foc;
  }
  function log(line) {
    var el = document.getElementById('log');
    el.textContent = line + '\n' + el.textContent;
    if (++last > 40) el.textContent = el.textContent.split('\n').slice(0, 40).join('\n');
  }
  if (!vv) {
    log('!! visualViewport 不存在（内核过旧），仅监控 window resize / 聚焦');
    window.addEventListener('resize', function () { n.win++; log(fmt('win-resize')); refresh(); });
    document.addEventListener('focusin', function (e) { n.foc++; log(fmt('focusin', e.target.id ? '#' + e.target.id : '')); refresh(); });
    document.addEventListener('focusout', function () { log(fmt('focusout')); refresh(); });
    setInterval(refresh, 300);
    refresh();
    return;
  }
  vv.addEventListener('resize', function () { n.vv++; log(fmt('vv-resize')); refresh(); });
  window.addEventListener('resize', function () { n.win++; log(fmt('win-resize')); refresh(); });
  document.addEventListener('focusin', function (e) { n.foc++; log(fmt('focusin', e.target.id ? '#' + e.target.id : '')); refresh(); });
  document.addEventListener('focusout', function () { log(fmt('focusout')); refresh(); });
  setInterval(refresh, 300);
  refresh();
  var chipbtn = document.getElementById('chipbtn');
  function paintChip() {
    var on = false;
    try { on = localStorage.getItem('kb_debug') === '1'; } catch (e) {}
    chipbtn.textContent = on ? '关闭 m.js 调试浮窗' : '开启 m.js 调试浮窗（排查其他页面用）';
  }
  chipbtn.addEventListener('click', function () {
    var on = false;
    try { on = localStorage.getItem('kb_debug') === '1'; localStorage.setItem('kb_debug', on ? '0' : '1'); } catch (e) {}
    paintChip();
  });
  paintChip();
})();
</script>
</body>
</html>
